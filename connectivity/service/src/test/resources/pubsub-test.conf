pubsub {
  consumer {
    init-timeout-seconds = 3
  }
  producer {
    init-timeout-seconds = 3
  }
}

pekko.connectors.googlecloud.pubsub {
  project-id = "my-local-project"
  project-id = ${?PUBSUB_PROJECT_ID}
  host = "localhost"
  host = ${?PUBSUB_EMULATOR_HOST}
  port = 8085
  port = ${?PUBSUB_EMULATOR_PORT}
}

pekko.connectors.google.credentials {
  none {}
  transport = "none"
}
